services:
    bmkg-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
            POSTGRES_DB: bmkg
        ports:
            - '5436:5432'
        volumes:
            - bmkg_db_data:/var/lib/postgresql/data
            - ./src/db/migrations/0000_init.sql:/docker-entrypoint-initdb.d/0000_init.sql:ro
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 5s
            retries: 5

    bmkg:
        build: .
        container_name: bmkg-mock
        env_file:
            - .env
        ports:
            - '${PORT:-8081}:8081'
        environment:
            PORT: 8081
            DATABASE_URL: postgresql://postgres:password@bmkg-db:5432/bmkg
        depends_on:
            bmkg-db:
                condition: service_healthy
        restart: unless-stopped

volumes:
    bmkg_db_data:
