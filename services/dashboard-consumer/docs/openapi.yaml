openapi: 3.0.3
info:
    title: BNPB Dashboard Consumer API
    version: 1.0.0
paths:
    /dashboard:
        get:
            summary: Dashboard page
            responses:
                '200':
                    description: HTML dashboard projection
                    content:
                        text/html:
                            schema:
                                type: string
    /api/hazards:
        get:
            summary: List dashboard hazard projection
            responses:
                '200':
                    description: Current projection rows
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/DashboardHazard'
    /health:
        get:
            summary: Health check
            responses:
                '200': { description: Service is healthy }
                '503': { description: Service is unhealthy }
    /health/live:
        get:
            summary: Liveness probe
            responses:
                '200': { description: Service is running }
    /health/ready:
        get:
            summary: Readiness probe
            responses:
                '200': { description: Service is ready }
                '503': { description: Service is not ready }
components:
    schemas:
        DashboardHazard:
            type: object
            required:
                [hazardId, source, hazardType, severity, areaName, occurredAt, lastEventId, lastEventType, updatedAt]
            properties:
                hazardId: { type: string, format: uuid }
                source: { type: string, enum: [BMKG, PVMBG] }
                hazardType: { type: string, enum: [SEISMIC, VOLCANIC] }
                severity: { type: string, enum: [NORMAL, WASPADA, SIAGA, AWAS] }
                areaName: { type: string }
                occurredAt: { type: string, format: date-time }
                lastEventId: { type: string, format: uuid }
                lastEventType: { type: string, enum: [hazard.created, hazard.updated] }
                updatedAt: { type: string, format: date-time }
