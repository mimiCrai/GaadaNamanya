# yaml-language-server: $schema=https://spec.openapis.org/oas/3.0/schema/2024-10-18
openapi: 3.0.3
info:
    title: BNPB Client API
    description: Client-facing hazard API. JWTs are verified against the public key published by bnpb-auth.
    version: 1.0.0
servers:
    - url: http://localhost:3000
      description: Local development server
paths:
    /health:
        get:
            summary: Health check
            responses:
                '200': { description: Service is healthy }
                '503': { description: Service is unhealthy }
    /health/live:
        get:
            summary: Liveness probe
            responses:
                '200': { description: Service is alive }
    /health/ready:
        get:
            summary: Readiness probe
            responses:
                '200': { description: Service is ready }
                '503': { description: Service is not ready (e.g. field report producer not yet connected to Kafka) }
    /metrics:
        get:
            summary: Prometheus metrics
            responses:
                '200': { description: Prometheus text format }
    /field-reports:
        post:
            summary: Tim Lapangan submits a field report (P3 #6); 202 only after Kafka acknowledged it
            description: >-
                Roles lapangan and internal. Order of checks - auth (401/403), body size (413), validation (400),
                publish with acks=-1 (503 + Retry-After when Kafka is unreachable within the timeout), 202.
                A resend with the same report_id is safe; the first stored version wins.
            tags: [Field Reports]
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            description: >-
                                Proposed contract (D-38), validated by the service so every 400 carries code invalid_body.
                                report_id (uuid, generated by the client), hazard_type (SEISMIC|VOLCANIC|WILDFIRE|COASTAL|OTHER),
                                latitude (-90..90), longitude (-180..180), description (1..2000 chars),
                                severity_estimate (NORMAL|WASPADA|SIAGA|AWAS), reported_at (ISO 8601 with offset).
                                No other fields; the reporter is taken from the JWT.
            responses:
                '202':
                    description: Durable in Kafka (acks=-1)
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [report_id, status, accepted_at]
                                properties:
                                    report_id: { type: string }
                                    status: { type: string, enum: [accepted] }
                                    accepted_at: { type: string, format: date-time }
                '400': { description: Invalid body (code invalid_body) }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '413': { description: Body larger than FIELD_REPORT_MAX_BODY_BYTES (code payload_too_large) }
                '503': { description: Kafka unreachable within FIELD_REPORT_PUBLISH_TIMEOUT_MS; resend later with the same report_id (Retry-After) }
    /field-reports/{reportId}:
        get:
            summary: Status of a field report (processed when stored); roles lapangan and internal
            tags: [Field Reports]
            security: [{ bearerAuth: [] }]
            parameters:
                - { name: reportId, in: path, required: true, schema: { type: string } }
            responses:
                '200': { description: 'Stored report with status processed' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { description: Not processed yet or unknown (code not_found) }
                '502': { $ref: '#/components/responses/UpstreamFailure' }
    /hazards:
        get:
            summary: List hazards visible to the authenticated user
            tags: [Hazards]
            security: [{ bearerAuth: [] }]
            parameters:
                - name: source
                  in: query
                  required: false
                  description: Return only hazards from BMKG, PVMBG, or Sensor Pantai. meta.sources then describes only that provider.
                  schema: { type: string, enum: [BMKG, PVMBG, SENSOR_PANTAI] }
            responses:
                '200':
                    description: Returns ringkasan for public users and mentah for lapangan/internal users. Data is the last canonical state held by BNPB; meta.sources tells whether each provider's data is current or stale.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/HazardListResponse' }
                '400': { description: Invalid source value }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '503': { $ref: '#/components/responses/Unavailable' }
                '502': { $ref: '#/components/responses/UpstreamFailure' }
                '504': { $ref: '#/components/responses/UpstreamTimeout' }
    /hazards/{hazardId}:
        get:
            summary: Get a hazard visible to the authenticated user
            tags: [Hazards]
            security: [{ bearerAuth: [] }]
            parameters:
                - name: hazardId
                  in: path
                  required: true
                  schema: { type: string }
            responses:
                '200':
                    description: Hazard record
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/HazardResponse' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { description: Hazard is absent or unavailable in the caller's permitted classification }
                '503': { $ref: '#/components/responses/Unavailable' }
                '502': { $ref: '#/components/responses/UpstreamFailure' }
                '504': { $ref: '#/components/responses/UpstreamTimeout' }
    /internal-ops/dlq:
        get:
            summary: BNPB Internal Ops only - list messages that could not be processed
            description: Requires role internal. Media (public) and Tim Lapangan (lapangan) receive 403.
            tags: [Internal Ops]
            security: [{ bearerAuth: [] }]
            parameters:
                - { name: source, in: query, schema: { type: string, enum: [BMKG, PVMBG, SATELIT, SENSOR_PANTAI, FIELD_REPORT] } }
                - { name: status, in: query, schema: { type: string, enum: [retrying, parked, recovered, superseded] } }
                - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
                - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 4096 } }
            responses:
                '200': { description: Page of unprocessed message metadata (no payload) }
                '400': { description: Invalid query or cursor }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '502': { $ref: '#/components/responses/UpstreamFailure' }
    /internal-ops/satellite/summary:
        get:
            summary: BNPB Internal Ops only - fire processor counters (single, low confidence, late, fires) and SATELIT DLQ
            description: Requires role internal. Proxies GET /internal/satellite/summary of the Aggregator.
            tags: [Internal Ops]
            security: [{ bearerAuth: [] }]
            responses:
                '200': { description: Summary }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '502': { $ref: '#/components/responses/UpstreamFailure' }
    /internal-ops/dlq/replay:
        post:
            summary: BNPB Internal Ops only - reprocess parked messages through the retry worker (P3 #4)
            description: Requires role internal. Media (public) and Tim Lapangan (lapangan) receive 403.
            tags: [Internal Ops]
            security: [{ bearerAuth: [] }]
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                source: { type: string, enum: [BMKG, PVMBG, SATELIT, SENSOR_PANTAI, FIELD_REPORT] }
                                category: { type: string }
                                reason_prefix: { type: string, maxLength: 200 }
                                status: { type: string, enum: [parked, retrying] }
            responses:
                '200':
                    description: '{matched, requeued, truncated, skipped:[{reason, count, message_ids}]}'
                    content:
                        application/json:
                            schema: { type: object, additionalProperties: true }
                '400': { description: Invalid replay filter }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '502': { $ref: '#/components/responses/UpstreamFailure' }
    /internal-ops/dlq/{messageId}:
        get:
            summary: BNPB Internal Ops only - one unprocessed message with raw payload as base64
            tags: [Internal Ops]
            security: [{ bearerAuth: [] }]
            parameters:
                - { name: messageId, in: path, required: true, schema: { type: string } }
            responses:
                '200':
                    description: 'Metadata, history and payload_base64'
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { description: Unknown message }
    /internal-ops/dlq/{messageId}/raw:
        get:
            summary: BNPB Internal Ops only - exact original payload bytes
            tags: [Internal Ops]
            security: [{ bearerAuth: [] }]
            parameters:
                - { name: messageId, in: path, required: true, schema: { type: string } }
            responses:
                '200':
                    description: Original bytes; X-Payload-SHA256 header carries the hash
                    content:
                        application/octet-stream:
                            schema: { type: string, format: binary }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '403': { $ref: '#/components/responses/Forbidden' }
                '404': { description: Unknown message }
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
    schemas:
        Hazard:
            type: object
            required: [Field, Tipe, Klasifikasi, Keterangan]
            properties:
                Field: { type: string }
                Tipe: { type: string }
                Klasifikasi: { type: string, enum: [ringkasan, mentah] }
                Keterangan: { type: string }
        SourceFreshness:
            type: object
            required: [status, lastSuccessfulPollAt, staleSince]
            properties:
                status:
                    type: string
                    enum: [HEALTHY, STALE, UNAVAILABLE]
                    description: HEALTHY = source synchronization succeeded; STALE = recent polling failed or sensor data stopped advancing; UNAVAILABLE = no successful poll yet.
                lastSuccessfulPollAt: { type: string, format: date-time, nullable: true }
                staleSince:
                    {
                        type: string,
                        format: date-time,
                        nullable: true,
                        description: When the provider's data stopped being refreshed; null while HEALTHY.,
                    }
        HazardMeta:
            type: object
            required: [sources]
            properties:
                partial:
                    {
                        type: boolean,
                        description: True when the result is incomplete. Internal storage locations are not exposed.,
                    }
                sources:
                    type: object
                    properties:
                        BMKG: { $ref: '#/components/schemas/SourceFreshness' }
                        PVMBG: { $ref: '#/components/schemas/SourceFreshness' }
                        SENSOR_PANTAI: { $ref: '#/components/schemas/SourceFreshness' }
        HazardResponse:
            type: object
            required: [data, meta]
            properties:
                data: { $ref: '#/components/schemas/Hazard' }
                meta: { $ref: '#/components/schemas/HazardMeta' }
        HazardListResponse:
            type: object
            required: [data, meta]
            properties:
                data:
                    type: array
                    items: { $ref: '#/components/schemas/Hazard' }
                meta: { $ref: '#/components/schemas/HazardMeta' }
        ErrorResponse:
            type: object
            properties:
                error:
                    type: object
                    properties:
                        code: { type: string, description: 'Present on Internal Ops errors, e.g. forbidden' }
                        message: { type: string }
    responses:
        Forbidden:
            description: Authenticated, but the role is not allowed (standard body with code forbidden)
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        Unavailable:
            description: Hazard request rejected at the concurrency limit, or storage lookup is incomplete. Lapangan has reserved capacity; public and internal share the remaining allowance.
            headers:
                Retry-After:
                    description: Delay in seconds before retrying a request rejected by admission control. Absent for unrelated storage failures.
                    schema: { type: integer, minimum: 1 }
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        Unauthorized:
            description: Missing, expired, or invalid access token
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        UpstreamFailure:
            description: bnpb-auth or BNPB Gateway could not be reached or returned an invalid response
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        UpstreamTimeout:
            description: BNPB Gateway did not answer within BNPB_GATEWAY_TIMEOUT_MS
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
