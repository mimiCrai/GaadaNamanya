openapi: 3.0.3
info:
    title: BNPB Client API
    description: Client-facing hazard API. JWTs are verified against the public key published by bnpb-auth.
    version: 1.0.0
servers:
    - url: http://localhost:3000
      description: Local development server
paths:
    /health:
        get:
            summary: Health check
            responses:
                '200': { description: Service is healthy }
                '503': { description: Service is unhealthy }
    /health/live:
        get:
            summary: Liveness probe
            responses:
                '200': { description: Service is alive }
    /health/ready:
        get:
            summary: Readiness probe
            responses:
                '200': { description: Service is ready }
                '503': { description: Service is not ready }
    /hazards:
        get:
            summary: List hazards visible to the authenticated user
            tags: [Hazards]
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    description: Returns ringkasan for public users and mentah for lapangan/internal users. Data is sourced from the internal BNPB Aggregator API.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/HazardListResponse' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '502': { $ref: '#/components/responses/UpstreamFailure' }
    /hazards/{hazardId}:
        get:
            summary: Get a hazard visible to the authenticated user
            tags: [Hazards]
            security: [{ bearerAuth: [] }]
            parameters:
                - name: hazardId
                  in: path
                  required: true
                  schema: { type: string }
            responses:
                '200':
                    description: Hazard record
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/HazardResponse' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { description: Hazard is absent or unavailable in the caller's permitted classification }
                '502': { $ref: '#/components/responses/UpstreamFailure' }
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
    schemas:
        Hazard:
            type: object
            required: [Field, Tipe, Klasifikasi, Keterangan]
            properties:
                Field: { type: string }
                Tipe: { type: string }
                Klasifikasi: { type: string, enum: [ringkasan, mentah] }
                Keterangan: { type: string }
        HazardResponse:
            type: object
            required: [data]
            properties:
                data: { $ref: '#/components/schemas/Hazard' }
        HazardListResponse:
            type: object
            required: [data]
            properties:
                data:
                    type: array
                    items: { $ref: '#/components/schemas/Hazard' }
        ErrorResponse:
            type: object
            properties:
                error:
                    type: object
                    properties:
                        message: { type: string }
    responses:
        Unauthorized:
            description: Missing, expired, or invalid access token
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        UpstreamFailure:
            description: bnpb-auth or BNPB Gateway could not be reached or returned an invalid response
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
