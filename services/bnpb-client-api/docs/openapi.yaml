openapi: 3.0.3
info:
    title: BNPB Client API
    description: Client-facing hazard API. JWTs are verified against the public key published by bnpb-auth.
    version: 1.0.0
servers:
    - url: http://localhost:3000
      description: Local development server
paths:
    /health:
        get:
            summary: Health check
            responses:
                '200': { description: Service is healthy }
                '503': { description: Service is unhealthy }
    /health/live:
        get:
            summary: Liveness probe
            responses:
                '200': { description: Service is alive }
    /health/ready:
        get:
            summary: Readiness probe
            responses:
                '200': { description: Service is ready }
                '503': { description: Service is not ready }
    /hazards:
        get:
            summary: List hazards visible to the authenticated user
            tags: [Hazards]
            security: [{ bearerAuth: [] }]
            parameters:
                - name: source
                  in: query
                  required: false
                  description: Return only hazards from this provider (BMKG = seismic, PVMBG = volcanic). meta.sources then describes only that provider.
                  schema: { type: string, enum: [BMKG, PVMBG] }
            responses:
                '200':
                    description: Returns ringkasan for public users and mentah for lapangan/internal users. Data is the last canonical state held by BNPB; meta.sources tells whether each provider's data is current or stale.
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/HazardListResponse' }
                '400': { description: Invalid source value }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '502': { $ref: '#/components/responses/UpstreamFailure' }
                '504': { $ref: '#/components/responses/UpstreamTimeout' }
    /hazards/{hazardId}:
        get:
            summary: Get a hazard visible to the authenticated user
            tags: [Hazards]
            security: [{ bearerAuth: [] }]
            parameters:
                - name: hazardId
                  in: path
                  required: true
                  schema: { type: string }
            responses:
                '200':
                    description: Hazard record
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/HazardResponse' }
                '401': { $ref: '#/components/responses/Unauthorized' }
                '404': { description: Hazard is absent or unavailable in the caller's permitted classification }
                '502': { $ref: '#/components/responses/UpstreamFailure' }
                '504': { $ref: '#/components/responses/UpstreamTimeout' }
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
    schemas:
        Hazard:
            type: object
            required: [Field, Tipe, Klasifikasi, Keterangan]
            properties:
                Field: { type: string }
                Tipe: { type: string }
                Klasifikasi: { type: string, enum: [ringkasan, mentah] }
                Keterangan: { type: string }
        SourceFreshness:
            type: object
            required: [status, lastSuccessfulPollAt, staleSince]
            properties:
                status:
                    type: string
                    enum: [HEALTHY, STALE, UNAVAILABLE]
                    description: HEALTHY = latest poll succeeded; STALE = serving the last stored data because recent polls failed; UNAVAILABLE = no successful poll yet.
                lastSuccessfulPollAt: { type: string, format: date-time, nullable: true }
                staleSince: { type: string, format: date-time, nullable: true, description: When the provider's data stopped being refreshed; null while HEALTHY. }
        HazardMeta:
            type: object
            required: [sources]
            properties:
                sources:
                    type: object
                    properties:
                        BMKG: { $ref: '#/components/schemas/SourceFreshness' }
                        PVMBG: { $ref: '#/components/schemas/SourceFreshness' }
        HazardResponse:
            type: object
            required: [data, meta]
            properties:
                data: { $ref: '#/components/schemas/Hazard' }
                meta: { $ref: '#/components/schemas/HazardMeta' }
        HazardListResponse:
            type: object
            required: [data, meta]
            properties:
                data:
                    type: array
                    items: { $ref: '#/components/schemas/Hazard' }
                meta: { $ref: '#/components/schemas/HazardMeta' }
        ErrorResponse:
            type: object
            properties:
                error:
                    type: object
                    properties:
                        message: { type: string }
    responses:
        Unauthorized:
            description: Missing, expired, or invalid access token
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        UpstreamFailure:
            description: bnpb-auth or BNPB Gateway could not be reached or returned an invalid response
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
        UpstreamTimeout:
            description: BNPB Gateway did not answer within BNPB_GATEWAY_TIMEOUT_MS
            content:
                application/json:
                    schema: { $ref: '#/components/schemas/ErrorResponse' }
