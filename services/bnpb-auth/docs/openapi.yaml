openapi: 3.0.3
info:
    title: BNPB Authentication Service API
    description: Issues RS256 access tokens, manages opaque refresh sessions, and administers BNPB user identities.
    version: 1.0.0

servers:
    - url: http://localhost:3000
      description: Local development server

paths:
    /public-key:
        get:
            summary: Get the JWT signing public key
            description: Returns the RSA public key used to verify RS256 access and refresh tokens.
            tags: [Authentication]
            responses:
                '200':
                    description: RSA public key in PEM format
                    content:
                        application/x-pem-file:
                            schema:
                                type: string

    /health:
        get:
            summary: Health check
            description: Returns the health status of the service
            operationId: getHealth
            tags:
                - Health
            responses:
                '200':
                    description: Service is healthy
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthResponse'
                '503':
                    description: Service is unhealthy
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthResponse'

    /health/live:
        get:
            summary: Liveness probe
            description: Returns OK if the service is running
            operationId: getLiveness
            tags:
                - Health
            responses:
                '200':
                    description: Service is alive
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        enum: [ok]

    /health/ready:
        get:
            summary: Readiness probe
            description: Returns OK if the service is ready to accept traffic
            operationId: getReadiness
            tags:
                - Health
            responses:
                '200':
                    description: Service is ready
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string
                                        enum: [ok, error]
                '503':
                    description: Service is not ready

    /auth/register:
        post:
            summary: Register a public user
            tags: [Authentication]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterRequest'
            responses:
                '201':
                    description: Public user registered and session created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResponse'
                '400':
                    description: Invalid request body
                '409':
                    description: Email already registered

    /auth/login:
        post:
            summary: Log in and create a session
            tags: [Authentication]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                '200':
                    description: Session created
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthResponse'
                '400':
                    description: Invalid request body
                '401':
                    description: Invalid credentials

    /auth/refresh:
        post:
            summary: Rotate a refresh session
            tags: [Authentication]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RefreshRequest'
            responses:
                '200':
                    description: New access and refresh tokens
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TokenResponse'
                '400':
                    description: Invalid request body
                '401':
                    description: Invalid refresh token

    /auth/logout:
        post:
            summary: Revoke a refresh session
            tags: [Authentication]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RefreshRequest'
            responses:
                '204':
                    description: Session revoked
                '400':
                    description: Invalid request body
                '401':
                    description: Invalid refresh token

    /admin/users:
        get:
            summary: List user accounts
            tags: [Administration]
            security: [{ bearerAuth: [] }]
            responses:
                '200':
                    description: User accounts
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserListResponse'
                '401': { description: Missing or invalid access token }
                '403': { description: Administrator role required }
        post:
            summary: Create a user account
            tags: [Administration]
            security: [{ bearerAuth: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/AdminCreateUserRequest' }
            responses:
                '201':
                    description: User account created
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/UserResponse' }
                '401': { description: Missing or invalid access token }
                '403': { description: Administrator role required }
                '409': { description: Email already registered }

    /admin/users/{id}:
        get:
            summary: Get a user account
            tags: [Administration]
            security: [{ bearerAuth: [] }]
            parameters: [{ $ref: '#/components/parameters/UserId' }]
            responses:
                '200':
                    description: User account
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/UserResponse' }
                '401': { description: Missing or invalid access token }
                '403': { description: Administrator role required }
                '404': { description: User not found }
        patch:
            summary: Update a user account
            tags: [Administration]
            security: [{ bearerAuth: [] }]
            parameters: [{ $ref: '#/components/parameters/UserId' }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema: { $ref: '#/components/schemas/AdminUpdateUserRequest' }
            responses:
                '200':
                    description: Updated user account
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/UserResponse' }
                '401': { description: Missing or invalid access token }
                '403': { description: Administrator role required }
                '404': { description: User not found }
                '409': { description: Email already registered }
        delete:
            summary: Delete a user account
            tags: [Administration]
            security: [{ bearerAuth: [] }]
            parameters: [{ $ref: '#/components/parameters/UserId' }]
            responses:
                '204': { description: User account deleted }
                '400': { description: Administrators cannot delete their own account }
                '401': { description: Missing or invalid access token }
                '403': { description: Administrator role required }
                '404': { description: User not found }

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
    parameters:
        UserId:
            name: id
            in: path
            required: true
            schema: { type: string, format: uuid }
    schemas:
        RegisterRequest:
            type: object
            required: [email, password]
            additionalProperties: false
            properties:
                email:
                    type: string
                    format: email
                password:
                    type: string
                    format: password
                    minLength: 8

        LoginRequest:
            type: object
            required: [email, password]
            properties:
                email:
                    type: string
                    format: email
                password:
                    type: string
                    format: password
                    minLength: 8

        RefreshRequest:
            type: object
            required: [refreshToken]
            properties:
                refreshToken:
                    type: string
                    minLength: 1

        AuthUser:
            type: object
            required: [id, email, role]
            properties:
                id:
                    type: string
                    format: uuid
                email:
                    type: string
                    format: email
                role:
                    type: string
                    enum: [public, lapangan, internal, admin]

        AdminCreateUserRequest:
            type: object
            required: [email, password, role]
            additionalProperties: false
            properties:
                email:
                    type: string
                    format: email
                password:
                    type: string
                    format: password
                    minLength: 8
                role: { type: string, enum: [public, lapangan, internal, admin] }

        AdminUpdateUserRequest:
            type: object
            minProperties: 1
            properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                role: { type: string, enum: [public, lapangan, internal, admin] }

        UserResponse:
            type: object
            required: [data]
            properties:
                data: { $ref: '#/components/schemas/AuthUser' }

        UserListResponse:
            type: object
            required: [data]
            properties:
                data:
                    type: array
                    items: { $ref: '#/components/schemas/AuthUser' }

        Tokens:
            type: object
            required: [accessToken, refreshToken]
            properties:
                accessToken:
                    type: string
                refreshToken:
                    type: string

        TokenResponse:
            type: object
            required: [data]
            properties:
                data:
                    $ref: '#/components/schemas/Tokens'

        AuthResponse:
            type: object
            required: [data]
            properties:
                data:
                    allOf:
                        - $ref: '#/components/schemas/Tokens'
                        - type: object
                          required: [user]
                          properties:
                              user:
                                  $ref: '#/components/schemas/AuthUser'

        HealthResponse:
            type: object
            properties:
                status:
                    type: string
                    enum: [healthy, unhealthy]
                timestamp:
                    type: string
                    format: date-time
                services:
                    type: object
                    properties:
                        database:
                            type: string
                            enum: [connected, disconnected]

        ErrorResponse:
            type: object
            properties:
                error:
                    type: object
                    properties:
                        message:
                            type: string
                        details:
                            type: array
                            items:
                                type: object
