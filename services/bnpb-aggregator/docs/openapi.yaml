openapi: 3.0.3
info:
    title: BNPB Aggregator Internal API
    description: Internal canonical-hazard read API. It is consumed by the BNPB Client API, not exposed directly to external clients.
    version: 1.0.0

servers:
    - url: http://localhost:3003
      description: Local development server

paths:
    /health:
        get:
            summary: Health check
            operationId: getHealth
            tags: [Health]
            responses:
                '200': { description: Service is healthy }
                '503': { description: Service is unhealthy }

    /health/live:
        get:
            summary: Liveness probe
            operationId: getLiveness
            tags: [Health]
            responses:
                '200': { description: Service is alive }

    /health/ready:
        get:
            summary: Readiness probe
            operationId: getReadiness
            tags: [Health]
            responses:
                '200': { description: Service is ready }
                '503': { description: Service is not ready }

    /internal/hazards:
        get:
            summary: List canonical hazard events
            operationId: getInternalHazards
            tags: [Hazards]
            security:
                - BNPBInternalApiKey: []
            parameters:
                - name: since
                  in: query
                  required: false
                  description: Return hazards ingested at or after this ISO 8601 timestamp, ordered oldest ingestion first.
                  schema:
                      type: string
                      format: date-time
                - name: source
                  in: query
                  required: false
                  description: Return only hazards from this provider.
                  schema:
                      type: string
                      enum: [BMKG, PVMBG]
            responses:
                '200':
                    description: Canonical hazard events; without since, newest occurrence first.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HazardEventListResponse'
                '400':
                    description: Invalid since timestamp or source
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '401': { description: Missing internal API key }
                '403': { description: Unrecognised internal API key }

    /internal/hazards/{hazardId}:
        get:
            summary: Get a canonical hazard event
            operationId: getInternalHazardById
            tags: [Hazards]
            security:
                - BNPBInternalApiKey: []
            parameters:
                - name: hazardId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Canonical hazard event
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HazardEventResponse'
                '404':
                    description: Hazard event not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '401': { description: Missing internal API key }
                '403': { description: Unrecognised internal API key }

components:
    securitySchemes:
        BNPBInternalApiKey:
            type: apiKey
            in: header
            name: X-BNPB-Internal-Key
    schemas:
        HazardEvent:
            type: object
            required:
                - hazardId
                - source
                - sourceRefId
                - hazardType
                - severity
                - areaName
                - latitude
                - longitude
                - occurredAt
                - ingestedAt
                - attributes
            properties:
                hazardId:
                    type: string
                    description: BNPB-generated canonical identifier
                source:
                    type: string
                    enum: [BMKG, PVMBG]
                sourceRefId:
                    type: string
                    description: Original source event_id or report_id
                hazardType:
                    type: string
                    enum: [SEISMIC, VOLCANIC]
                severity:
                    type: string
                    enum: [NORMAL, WASPADA, SIAGA, AWAS]
                areaName:
                    type: string
                latitude:
                    type: number
                    format: double
                longitude:
                    type: number
                    format: double
                occurredAt:
                    type: string
                    format: date-time
                ingestedAt:
                    type: string
                    format: date-time
                attributes:
                    type: object
                    additionalProperties: true

        HazardEventListResponse:
            type: object
            required: [data]
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/HazardEvent'
                meta:
                    $ref: '#/components/schemas/PollingMeta'

        HazardEventResponse:
            type: object
            required: [data]
            properties:
                data:
                    $ref: '#/components/schemas/HazardEvent'
                meta:
                    $ref: '#/components/schemas/PollingMeta'

        PollingMeta:
            type: object
            required: [pollingStatus]
            properties:
                pollingStatus:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/PollingStatus'

        PollingStatus:
            type: object
            required: [status]
            properties:
                status:
                    type: string
                    enum: [HEALTHY, STALE, UNAVAILABLE]
                lastSuccessfulPollAt:
                    type: string
                    format: date-time
                    nullable: true
                staleSince:
                    type: string
                    format: date-time
                    nullable: true

        ErrorResponse:
            type: object
            required: [error]
            properties:
                error:
                    type: object
                    required: [message]
                    properties:
                        message:
                            type: string
