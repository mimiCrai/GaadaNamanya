# yaml-language-server: $schema=https://spec.openapis.org/oas/3.0/schema/2024-10-18
openapi: 3.0.3
info:
    title: BNPB Aggregator Internal API
    description: Internal canonical-hazard read API. It is consumed by the BNPB Client API, not exposed directly to external clients.
    version: 1.0.0

servers:
    - url: http://localhost:3003
      description: Local development server

paths:
    /internal/analytics:
        get:
            summary: Canonical counts across shards, with UTC occurrence range and availability
            description: >-
                byType and byDay include TSUNAMI for SEISMIC events with an attributes.tsunami_warning
                object. These events also remain in SEISMIC, so type-series counts overlap.
                total, bySource, bySeverity, byArea and byMonth count each canonical event once.
                Daily buckets use the event occurrence time in UTC and the range is [from, to).
            parameters:
                - { in: query, name: from, schema: { type: string, format: date-time } }
                - { in: query, name: to, schema: { type: string, format: date-time } }
            responses:
                '200': { description: Counts and daily series; inspect partial and degraded }
                '400': { description: Invalid range }
                '401': { description: Missing internal key }
                '403': { description: Invalid internal key }
    /internal/sensor-pantai/status:
        get:
            summary: Sensor freshness, checkpoint timestamps, and circuit breaker retry time
            security: [{ AuditBearer: [] }]
            responses:
                '200': { description: Persisted sensor state without credentials or upstream cursor }
                '401': { description: Missing or invalid audit token }
    /internal/sensor-pantai/rejected:
        get:
            summary: Inspect quarantined sensor messages
            security: [{ AuditBearer: [] }]
            parameters:
                - in: query
                  name: limit
                  schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
            responses:
                '200': { description: 'Latest rejected messages, with reason and first receipt time' }
                '400': { description: Invalid limit }
                '401': { description: Missing or invalid audit token }
    /internal/leadership:
        get:
            summary: Inspect background polling and relay ownership
            security: [{ BNPBInternalApiKey: [] }]
            responses:
                '200':
                    description: Instance identity and persisted lease, using database timestamps
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [instanceId, lease]
                                properties:
                                    instanceId: { type: string }
                                    lease:
                                        type: object
                                        nullable: true
                                        properties:
                                            ownerId: { type: string, nullable: true }
                                            epoch: { type: integer }
                                            expiresAt: { type: string, format: date-time }
                                            checkedAt: { type: string, format: date-time }
                                            guardVersion: { type: integer }
                '401': { description: Missing internal key }
                '403': { description: Invalid internal key }
    /internal/pvmbg/mapping:
        get:
            summary: PVMBG mapping active on THIS replica (hash, label, source, last error), D-36
            security: [{ BNPBInternalApiKey: [] }]
            responses:
                '200':
                    description: Active mapping; an invalid file shows up in last_error while the previous mapping stays
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [instance_id, hash, label, source, loaded_at, mapping]
                                properties:
                                    instance_id: { type: string }
                                    path: { type: string }
                                    hash: { type: string, description: sha256 of the file bytes (or of the builtin mapping) }
                                    label: { type: string }
                                    source: { type: string, enum: [builtin, file] }
                                    loaded_at: { type: string, format: date-time }
                                    last_checked_at: { type: string, format: date-time, nullable: true }
                                    last_error: { type: string, nullable: true }
                                    mapping: { type: object, additionalProperties: true }
                '401': { description: Missing internal key }
                '403': { description: Invalid internal key }
    /internal/audit/unprocessed:
        get:
            summary: Messages that could not be processed (Lampiran A); recovered messages are excluded
            security: [{ AuditBearer: [] }]
            parameters:
                - { $ref: '#/components/parameters/UnprocessedSource' }
                - { $ref: '#/components/parameters/PageLimit' }
                - { $ref: '#/components/parameters/PageCursor' }
            responses:
                '200':
                    description: Complete or explicitly partial page, ordered by received_at then message_id
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [items, next_cursor, partial, unavailable_units]
                                properties:
                                    items:
                                        type: array
                                        items:
                                            type: object
                                            required:
                                                [message_id, source, received_at, reason, retryable, attempts, status]
                                            properties:
                                                message_id: { type: string, example: msg-31c9a0b1c2d3e4f5a6b7c8d9 }
                                                source: { type: string }
                                                received_at: { type: string, format: date-time }
                                                reason:
                                                    type: string
                                                    example: "schema_incompatible: field 'level' berubah dari number menjadi string"
                                                retryable: { type: boolean }
                                                attempts: { type: integer, minimum: 1 }
                                                status: { type: string, enum: [retrying, parked] }
                                    next_cursor: { type: string, nullable: true }
                                    partial: { type: boolean }
                                    unavailable_units: { type: array, items: { type: string } }
                '400': { description: Invalid query or cursor }
                '401': { description: Invalid or missing audit token }

    /internal/dlq:
        get:
            summary: Internal Ops inspection list of unprocessed messages (metadata only)
            security: [{ BNPBInternalApiKey: [] }]
            parameters:
                - { $ref: '#/components/parameters/UnprocessedSource' }
                - name: status
                  in: query
                  schema: { type: string, enum: [retrying, parked, recovered, superseded] }
                - { $ref: '#/components/parameters/PageLimit' }
                - { $ref: '#/components/parameters/PageCursor' }
            responses:
                '200': { description: Page of unprocessed message metadata }
                '400': { description: Invalid query or cursor }
                '401': { description: Missing internal API key }
                '403': { description: Unrecognised internal API key }
        post:
            summary: Store a message another component could not process (field-report-processor, D-39)
            description: Dedup by message_id (sha256 of source, kind and payload); 201 when new, 200 when already stored.
            security: [{ BNPBInternalApiKey: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [source, kind, payload_base64, content_type, correlation_id, category, detail]
                            properties:
                                source: { type: string, enum: [BMKG, PVMBG, SATELIT, SENSOR_PANTAI, FIELD_REPORT] }
                                kind: { type: string, example: kafka.field-report }
                                topic: { type: string, nullable: true }
                                endpoint: { type: string, nullable: true }
                                payload_base64: { type: string, description: exact original bytes }
                                content_type: { type: string }
                                correlation_id: { type: string }
                                source_ref_id: { type: string, nullable: true }
                                category: { type: string, description: 'taxonomy category, e.g. conflict or malformed_json' }
                                detail: { type: string }
            responses:
                '200': { description: Already stored (same bytes) }
                '201': { description: Stored }
                '400': { description: Invalid body }
                '401': { description: Missing internal API key }
                '403': { description: Unrecognised internal API key }

    /internal/field-reports:
        get:
            summary: Stored field reports ordered by report_id (verification, P3 #6)
            security: [{ BNPBInternalApiKey: [] }]
            parameters:
                - { name: after, in: query, schema: { type: string, format: uuid } }
                - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
            responses:
                '200': { description: '{items:[FieldReport], next_after: string|null}' }
                '400': { description: Invalid after or limit }
                '401': { description: Missing internal API key }
                '403': { description: Unrecognised internal API key }
    /internal/field-reports/{reportId}:
        parameters:
            - { name: reportId, in: path, required: true, schema: { type: string } }
        put:
            summary: Idempotent insert of one field report (_id = report_id, first write wins), D-39
            description: Served by any replica without the background lease. Result created, duplicate (same content) or conflict (different content; nothing changed).
            security: [{ BNPBInternalApiKey: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [message]
                            properties:
                                message: { type: object, description: 'field-reports Kafka message {v, report, reporter, accepted_at}' }
                                kafka:
                                    type: object
                                    nullable: true
                                    properties:
                                        topic: { type: string }
                                        partition: { type: integer }
                                        offset: { type: string }
            responses:
                '200': { description: '{result: created|duplicate|conflict, incoming_sha256, report}' }
                '400': { description: Invalid message or report_id mismatch }
                '401': { description: Missing internal API key }
                '403': { description: Unrecognised internal API key }
        get:
            summary: One stored field report (status processed)
            security: [{ BNPBInternalApiKey: [] }]
            responses:
                '200': { description: Stored field report }
                '404': { description: Not stored (yet) }
                '401': { description: Missing internal API key }
                '403': { description: Unrecognised internal API key }

    /internal/dlq/replay:
        post:
            summary: Requeue unprocessed messages for the retry worker (D-37); default only parked entries
            security: [{ BNPBInternalApiKey: [] }]
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            properties:
                                source: { type: string, enum: [BMKG, PVMBG, SATELIT, SENSOR_PANTAI, FIELD_REPORT] }
                                category: { type: string, description: 'error category, e.g. schema_incompatible' }
                                reason_prefix: { type: string, maxLength: 200 }
                                status: { type: string, enum: [parked, retrying], default: parked }
            responses:
                '200':
                    description: Requeued and skipped entries
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [matched, requeued, truncated, skipped]
                                properties:
                                    matched: { type: integer }
                                    requeued: { type: integer }
                                    truncated: { type: boolean }
                                    skipped:
                                        type: array
                                        items:
                                            type: object
                                            required: [reason, count, message_ids]
                                            properties:
                                                reason: { type: string, enum: [handler_missing, claimed, status_changed] }
                                                count: { type: integer }
                                                message_ids: { type: array, items: { type: string } }
                '400': { description: Invalid filter }
                '401': { description: Missing internal key }
                '403': { description: Invalid internal key }
    /internal/dlq/{messageId}:
        get:
            summary: One unprocessed message with its raw payload as base64
            security: [{ BNPBInternalApiKey: [] }]
            parameters:
                - { name: messageId, in: path, required: true, schema: { type: string } }
            responses:
                '200':
                    description: 'Metadata, history and payload_base64 (null with payload_truncated=true above DLQ_INSPECT_MAX_BYTES)'
                '404': { description: Unknown message }

    /internal/dlq/{messageId}/raw:
        get:
            summary: Exact original payload bytes (streamed; any size)
            security: [{ BNPBInternalApiKey: [] }]
            parameters:
                - { name: messageId, in: path, required: true, schema: { type: string } }
            responses:
                '200':
                    description: Original bytes; X-Payload-SHA256 header carries the hash
                    content:
                        application/octet-stream:
                            schema: { type: string, format: binary }
                '404': { description: Unknown message }

    /internal/hazards/batch:
        post:
            summary: Idempotent batch upsert/delete of SATELIT HazardEvents (usulan 3.4), lease-free
            description: One transaction per op addressed by _id. Applied only if version (feed offset) >= stored version and >= tombstone; a stale op is skipped. Delete removes the document, writes a tombstone and enqueues hazard.deleted.
            security: [{ BNPBInternalApiKey: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [ops]
                            properties:
                                ops:
                                    type: array
                                    minItems: 1
                                    maxItems: 500
                                    items: { type: object, description: '{op: upsert|delete, source: SATELIT, source_ref_id, version, hazard?}' }
            responses:
                '200': { description: '{results: [{op, source_ref_id, hazard_id, result: applied|unchanged|skipped}], applied, unchanged, skipped}' }
                '400': { description: Invalid batch }
                '401': { description: Missing internal API key }
                '403': { description: Unrecognised internal API key }

    /internal/fire-processor/snapshot:
        put:
            summary: Store the fire processor snapshot (gzip JSON) in GridFS; guarded by X-Feed-Offset >= stored
            security: [{ BNPBInternalApiKey: [] }]
            parameters:
                - { name: X-Feed-Offset, in: header, required: true, schema: { type: string } }
                - { name: X-Kafka-Offset, in: header, required: false, schema: { type: string } }
            requestBody:
                required: true
                content:
                    application/gzip:
                        schema: { type: string, format: binary }
            responses:
                '200': { description: '{stored: true, feed_offset, kafka_offset, sha256, size_bytes, saved_at}' }
                '400': { description: Invalid headers or content type }
                '409': { description: A newer snapshot is stored }
                '413': { description: Snapshot larger than FIRE_SNAPSHOT_MAX_BYTES }
        get:
            summary: Latest fire processor snapshot (gzip JSON), headers X-Feed-Offset, X-Kafka-Offset, X-Snapshot-SHA256
            security: [{ BNPBInternalApiKey: [] }]
            responses:
                '200':
                    description: Snapshot bytes
                    content:
                        application/gzip:
                            schema: { type: string, format: binary }
                '404': { description: No snapshot stored yet }

    /internal/fire-processor/stats:
        put:
            summary: Publish fire processor counters for /internal/satellite/summary; guarded by last_offset >=
            security: [{ BNPBInternalApiKey: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [last_offset, stats]
                            properties:
                                last_offset: { type: integer }
                                instance_id: { type: string, nullable: true }
                                stats: { type: object }
            responses:
                '200': { description: '{stored: boolean}' }
                '400': { description: Invalid stats }

    /internal/satellite/late-detections:
        post:
            summary: Store late detections (P4 #2) in late_detections, idempotent per feed offset
            security: [{ BNPBInternalApiKey: [] }]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [items]
                            properties:
                                items:
                                    type: array
                                    minItems: 1
                                    maxItems: 5000
                                    items: { type: object, description: '{offset, detection_key, kind, event_time, watermark, received_at}' }
            responses:
                '200': { description: '{inserted, existing}' }
                '400': { description: Invalid items }

    /internal/satellite/summary:
        get:
            summary: Fire processor counters (single, low, late, fires...), stored late detections, SATELIT HazardEvents and DLQ
            security: [{ BNPBInternalApiKey: [] }]
            responses:
                '200': { description: '{processor, late_detections_stored, hazard_events, unprocessed, partial}' }

    /internal/satellite/status:
        get:
            summary: Satellite feed ingest state of this instance (only the leader holds the stream)
            security: [{ BNPBInternalApiKey: [] }]
            responses:
                '200':
                    description: 'Offsets (received, durable, latest), lag, reconnects by reason, events by type'
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    enabled: { type: boolean }
                                    instance_id: { type: string }
                                    leader: { type: boolean }
                                    epoch: { type: integer, nullable: true }
                                    connected: { type: boolean }
                                    current_from: { type: integer, nullable: true }
                                    last_offset_received: { type: integer, nullable: true }
                                    last_offset_durable: { type: integer, nullable: true }
                                    latest_offset: { type: integer, nullable: true }
                                    lag_offsets: { type: integer, nullable: true }
                                    last_heartbeat_virtual_now: { type: string, nullable: true }
                                    session_speed: { type: number, nullable: true }
                                    reconnects: { type: object, additionalProperties: { type: integer } }
                                    events: { type: object, additionalProperties: { type: integer } }
                                    duplicates: { type: integer }
                                    gaps: { type: integer }
                                    last_error: { type: string, nullable: true }
                '401': { description: Missing internal key }
                '403': { description: Invalid internal key }

    /internal/satellite/disconnect:
        post:
            summary: 'Test hook (P4 #8): drop the current feed connection; ingest resumes from the durable checkpoint'
            security: [{ BNPBInternalApiKey: [] }]
            responses:
                '202': { description: Connection dropped }
                '409': { description: 'This instance holds no stream (not the leader, or between connections)' }
                '401': { description: Missing internal key }
                '403': { description: Invalid internal key }

    /metrics:
        get:
            summary: Prometheus metrics
            tags: [Health]
            responses:
                '200': { description: Prometheus text exposition format }

    /health:
        get:
            summary: Health check
            operationId: getHealth
            tags: [Health]
            responses:
                '200': { description: Service is healthy }
                '503': { description: Service is unhealthy }

    /health/live:
        get:
            summary: Liveness probe
            operationId: getLiveness
            tags: [Health]
            responses:
                '200': { description: Service is alive }

    /health/ready:
        get:
            summary: Readiness probe
            operationId: getReadiness
            tags: [Health]
            responses:
                '200': { description: Service is ready }
                '503': { description: Service is not ready }

    /internal/audit/events:
        get:
            summary: Audit canonical hazards in ingestion order
            security: [{ AuditBearer: [] }]
            parameters:
                - { $ref: '#/components/parameters/AuditSource' }
                - { $ref: '#/components/parameters/PageLimit' }
                - { $ref: '#/components/parameters/PageCursor' }
                - name: since
                  in: query
                  schema: { type: string, format: date-time }
            responses:
                '200':
                    description: Complete or explicitly partial page
                    content:
                        application/json:
                            schema: { $ref: '#/components/schemas/AuditPage' }
                '400': { description: Invalid query or cursor }
                '401': { description: Invalid or missing audit token }

    /internal/audit/checksum:
        get:
            summary: SHA-256 of source_ref_id values in UTF-8 byte order
            security: [{ AuditBearer: [] }]
            parameters:
                - { $ref: '#/components/parameters/AuditSource' }
            responses:
                '200':
                    description: Count and checksum, with partial status
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [source, count, checksum, algorithm, as_of, partial, unavailable_units]
                                properties:
                                    source: { type: string, nullable: true }
                                    count: { type: integer }
                                    checksum: { type: string, pattern: '^[a-f0-9]{64}$' }
                                    algorithm: { type: string, enum: [sha256] }
                                    as_of: { type: string, format: date-time }
                                    partial: { type: boolean }
                                    unavailable_units: { type: array, items: { type: string } }
                '400': { description: Invalid source }
                '401': { description: Invalid or missing audit token }

    /internal/audit/location:
        get:
            summary: Owning shard and replica locations from MongoDB metadata
            security: [{ AuditBearer: [] }]
            parameters:
                - name: hazard_id
                  in: query
                  required: true
                  schema: { type: string, minLength: 1, maxLength: 128 }
            responses:
                '200':
                    description: Locations, or partial result when existence or placement is unknown
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [hazard_id, locations, partial]
                                properties:
                                    hazard_id: { type: string }
                                    partial: { type: boolean }
                                    unavailable_units: { type: array, items: { type: string } }
                                    locations:
                                        type: array
                                        items:
                                            type: object
                                            required: [node, unit, role]
                                            properties:
                                                node: { type: string }
                                                unit: { type: string }
                                                role: { type: string, enum: [primary, replica] }
                '400': { description: Invalid hazard_id }
                '401': { description: Invalid or missing audit token }
                '404': { description: Hazard absent from a complete storage read }

    /internal/hazards:
        get:
            summary: List canonical hazard events
            operationId: getInternalHazards
            tags: [Hazards]
            security:
                - BNPBInternalApiKey: []
            parameters:
                - { $ref: '#/components/parameters/PageLimit' }
                - { $ref: '#/components/parameters/PageCursor' }
                - name: since
                  in: query
                  required: false
                  description: Return hazards ingested at or after this ISO 8601 timestamp, ordered oldest ingestion first.
                  schema:
                      type: string
                      format: date-time
                - name: source
                  in: query
                  required: false
                  description: Return only hazards from this provider.
                  schema:
                      type: string
                      enum: [BMKG, PVMBG, SATELIT, SENSOR_PANTAI]
            responses:
                '200':
                    description: Canonical hazard events; without since, newest occurrence first.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HazardEventListResponse'
                '400':
                    description: Invalid since timestamp or source
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '401': { description: Missing internal API key }
                '403': { description: Unrecognised internal API key }

    /internal/hazards/{hazardId}:
        get:
            summary: Get a canonical hazard event
            operationId: getInternalHazardById
            tags: [Hazards]
            security:
                - BNPBInternalApiKey: []
            parameters:
                - name: hazardId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Canonical hazard event
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HazardEventResponse'
                '404':
                    description: Hazard event not found
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                '401': { description: Missing internal API key }
                '403': { description: Unrecognised internal API key }

components:
    parameters:
        AuditSource:
            name: source
            in: query
            schema: { type: string, enum: [BMKG, PVMBG, SATELIT, SENSOR_PANTAI] }
        UnprocessedSource:
            name: source
            in: query
            schema: { type: string, enum: [BMKG, PVMBG, SATELIT, SENSOR_PANTAI, FIELD_REPORT] }
        PageLimit:
            name: limit
            in: query
            schema: { type: integer, minimum: 1, maximum: 1000 }
        PageCursor:
            name: cursor
            in: query
            schema: { type: string, minLength: 1, maxLength: 4096 }
    securitySchemes:
        AuditBearer:
            type: http
            scheme: bearer
        BNPBInternalApiKey:
            type: apiKey
            in: header
            name: X-BNPB-Internal-Key
    schemas:
        AuditPage:
            type: object
            required: [items, next_cursor, partial, unavailable_units]
            properties:
                items:
                    type: array
                    items:
                        type: object
                        required:
                            [
                                hazard_id,
                                source,
                                source_ref_id,
                                hazard_type,
                                severity,
                                area_name,
                                latitude,
                                longitude,
                                occurred_at,
                                ingested_at,
                                attributes,
                            ]
                        properties:
                            hazard_id: { type: string }
                            source: { type: string, enum: [BMKG, PVMBG, SATELIT, SENSOR_PANTAI] }
                            source_ref_id: { type: string }
                            hazard_type: { type: string, enum: [SEISMIC, VOLCANIC, WILDFIRE, COASTAL] }
                            severity: { type: string, enum: [NORMAL, WASPADA, SIAGA, AWAS] }
                            area_name: { type: string }
                            latitude: { type: number }
                            longitude: { type: number }
                            occurred_at: { type: string, format: date-time }
                            ingested_at: { type: string, format: date-time }
                            attributes: { type: object, additionalProperties: true }
                next_cursor: { type: string, nullable: true }
                partial: { type: boolean }
                unavailable_units: { type: array, items: { type: string } }
        HazardEvent:
            type: object
            required:
                - hazardId
                - source
                - sourceRefId
                - hazardType
                - severity
                - areaName
                - latitude
                - longitude
                - occurredAt
                - ingestedAt
                - attributes
            properties:
                hazardId:
                    type: string
                    description: BNPB-generated canonical identifier
                source:
                    type: string
                    enum: [BMKG, PVMBG, SATELIT, SENSOR_PANTAI]
                sourceRefId:
                    type: string
                    description: Original source event_id or report_id
                hazardType:
                    type: string
                    enum: [SEISMIC, VOLCANIC, WILDFIRE, COASTAL]
                severity:
                    type: string
                    enum: [NORMAL, WASPADA, SIAGA, AWAS]
                areaName:
                    type: string
                latitude:
                    type: number
                    format: double
                longitude:
                    type: number
                    format: double
                occurredAt:
                    type: string
                    format: date-time
                ingestedAt:
                    type: string
                    format: date-time
                attributes:
                    type: object
                    additionalProperties: true

        HazardEventListResponse:
            type: object
            required: [data]
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/HazardEvent'
                meta:
                    $ref: '#/components/schemas/PollingMeta'

        HazardEventResponse:
            type: object
            required: [data]
            properties:
                data:
                    $ref: '#/components/schemas/HazardEvent'
                meta:
                    $ref: '#/components/schemas/PollingMeta'

        PollingMeta:
            type: object
            required: [pollingStatus]
            properties:
                partial: { type: boolean }
                unavailable_units: { type: array, items: { type: string } }
                nextCursor: { type: string, nullable: true }
                pollingStatus:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/PollingStatus'

        PollingStatus:
            type: object
            required: [status]
            properties:
                status:
                    type: string
                    enum: [HEALTHY, STALE, UNAVAILABLE]
                lastSuccessfulPollAt:
                    type: string
                    format: date-time
                    nullable: true
                staleSince:
                    type: string
                    format: date-time
                    nullable: true

        ErrorResponse:
            type: object
            required: [error]
            properties:
                error:
                    type: object
                    required: [message]
                    properties:
                        message:
                            type: string
