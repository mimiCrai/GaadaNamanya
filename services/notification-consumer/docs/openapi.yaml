openapi: 3.0.3
info:
    title: BNPB Notification Consumer API
    version: 1.0.0
paths:
    /notifications:
        get:
            summary: Notification inbox page
            responses:
                '200':
                    description: HTML notification inbox
                    content:
                        text/html:
                            schema:
                                type: string
    /api/notifications:
        get:
            summary: List notification inbox entries
            responses:
                '200':
                    description: Stored notifications
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [data]
                                properties:
                                    data:
                                        type: array
                                        items:
                                            $ref: '#/components/schemas/Notification'
    /health:
        get:
            summary: Health check
            responses:
                '200': { description: Service is healthy }
                '503': { description: Service is unhealthy }
    /health/live:
        get:
            summary: Liveness probe
            responses:
                '200': { description: Service is running }
    /health/ready:
        get:
            summary: Readiness probe
            responses:
                '200': { description: Service is ready }
                '503': { description: Service is not ready }
components:
    schemas:
        Notification:
            type: object
            required: [eventId, hazardId, eventType, severity, areaName, title, message, occurredAt, createdAt]
            properties:
                eventId: { type: string, format: uuid }
                hazardId: { type: string, format: uuid }
                eventType: { type: string, enum: [hazard.created, hazard.updated] }
                severity: { type: string, enum: [SIAGA, AWAS] }
                areaName: { type: string }
                title: { type: string }
                message: { type: string }
                occurredAt: { type: string, format: date-time }
                createdAt: { type: string, format: date-time }
