# Override for scripts/satellite/p4-reconnect-test.sh (P4 #8). Use together with docker-compose.yml and
# docker-compose.e2e.yml. Default target is the local stub feed; --real points the Aggregator at the real feed.
services:
    satellite-stub:
        build: ./tests/e2e/satellite-stub
        labels:
            role: mock
        environment:
            STUB_TOKEN: ${P4_STUB_TOKEN:-stub-satellite-token-0123456789}
            STUB_LAST_OFFSET: ${P4_STUB_LAST_OFFSET:-1200}
            STUB_INTERVAL_MS: ${P4_STUB_INTERVAL_MS:-40}
            STUB_MALFORMED_OFFSETS: ${P4_STUB_MALFORMED_OFFSETS:-133,377}
        healthcheck:
            test: ['CMD', 'node', '-e', "fetch('http://localhost:8090/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
            interval: 2s
            timeout: 2s
            retries: 15
        deploy:
            resources:
                limits: { memory: 128M }
                reservations: { memory: 64M }

    bnpb-aggregator:
        environment:
            SATELLITE_INGEST_ENABLED: 'true'
            SATELLITE_BASE_URL: ${P4_SATELLITE_BASE_URL:-http://satellite-stub:8090}
            SATELLITE_TOKEN: ${P4_SATELLITE_TOKEN:-stub-satellite-token-0123456789}
            SATELLITE_IDLE_TIMEOUT_MS: ${P4_SATELLITE_IDLE_TIMEOUT_MS:-20000}
            SATELLITE_BACKOFF_BASE_MS: 250
            SATELLITE_BACKOFF_CAP_MS: 3000
            SATELLITE_429_BACKOFF_BASE_MS: 500
            SATELLITE_429_BACKOFF_CAP_MS: 3000
            # Shorter lease so a killed leader is replaced in ~6 s instead of ~15 s.
            BACKGROUND_LEASE_MS: 6000
            BACKGROUND_LEASE_RENEW_MS: 1000
            LEASE_OPERATION_TIMEOUT_MS: 2000
        depends_on:
            satellite-stub:
                condition: service_healthy
