global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    option redispatch
    retries 2
    timeout connect 2s
    timeout client 15s
    timeout server 10s
    timeout check 2s

resolvers docker
    nameserver embedded 127.0.0.11:53
    accepted_payload_size 8192
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold nx 1s
    hold obsolete 1s

frontend api
    bind ":${PORT}"
    default_backend aggregators

backend aggregators
    balance roundrobin
    retry-on conn-failure empty-response response-timeout
    option httpchk GET /health/ready
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
    server-template aggregator 1-10 "bnpb-aggregator:${BACKEND_PORT}" check resolvers docker resolve-prefer ipv4 init-addr none
