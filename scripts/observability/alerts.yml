groups:
  - name: bnpb
    rules:
      - alert: ApplicationUnavailable
        expr: up{job=~"applications|bnpb-aggregator"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Application scrape unavailable'
      - alert: AggregatorLeaderMissing
        expr: sum(bnpb_aggregator_leader) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: 'No Aggregator reports active leadership'
      - alert: OutboxDelayed
        expr: max(bnpb_aggregator_outbox_oldest_seconds) > 30
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Outbox has unpublished events older than 30 seconds'
      - alert: SourceCircuitOpen
        expr: max by (stream) (bnpb_aggregator_source_circuit_open) == 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Source remains in circuit cooldown'
      - alert: MetricsStorageUnavailable
        expr: bnpb_aggregator_metrics_read_error == 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'Aggregator cannot read storage metrics'
      - alert: DlqMetricsUnavailable
        expr: bnpb_aggregator_unprocessed_messages_scrape_error == 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: 'DLQ storage snapshot is unavailable'
