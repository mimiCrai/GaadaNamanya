x-telemetry: &telemetry
    OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_EXPORTER_OTLP_TIMEOUT: 3000
    OTEL_BSP_SCHEDULE_DELAY: 1000
    OTEL_TRACES_SAMPLER: parentbased_traceidratio
    OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}

services:
    bmkg:
        environment:
            <<: *telemetry
            OTEL_SERVICE_NAME: bmkg
    pvmbg:
        environment:
            <<: *telemetry
            OTEL_SERVICE_NAME: pvmbg
    bnpb-auth:
        environment:
            <<: *telemetry
            OTEL_SERVICE_NAME: bnpb-auth
    bnpb-client-api:
        environment:
            <<: *telemetry
            OTEL_SERVICE_NAME: bnpb-client-api
    bnpb-aggregator:
        environment:
            <<: *telemetry
            OTEL_SERVICE_NAME: bnpb-aggregator
    dashboard-consumer:
        environment:
            <<: *telemetry
            OTEL_SERVICE_NAME: dashboard-consumer
    notification-consumer:
        environment:
            <<: *telemetry
            OTEL_SERVICE_NAME: notification-consumer

    prometheus:
        image: prom/prometheus:v3.16.0
        command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=3d']
        configs:
            - source: prometheus
              target: /etc/prometheus/prometheus.yml
        volumes:
            - prometheus_data:/prometheus
        ports:
            - '127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090'

    tempo:
        image: grafana/tempo:3.1.1
        command: ['-target=all', '-config.file=/etc/tempo.yml']
        volumes:
            - ./scripts/observability/tempo.yml:/etc/tempo.yml:ro
            - tempo_data:/var/tempo
        ports:
            - '127.0.0.1:${TEMPO_HOST_PORT:-3200}:3200'

    otel-collector:
        image: otel/opentelemetry-collector-contrib:0.165.0
        command: ['--config=/etc/otel-collector.yml']
        volumes:
            - ./scripts/observability/collector.yml:/etc/otel-collector.yml:ro
        depends_on:
            - tempo

    grafana:
        image: grafana/grafana:13.3.1
        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-password}
            GF_USERS_ALLOW_SIGN_UP: 'false'
            GF_ANALYTICS_REPORTING_ENABLED: 'false'
            GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
        volumes:
            - ./scripts/observability/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./scripts/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana_data:/var/lib/grafana
        ports:
            - '127.0.0.1:${GRAFANA_HOST_PORT:-3006}:3000'
        depends_on:
            - prometheus
            - tempo

    observability-tests:
        profiles: [test]
        build: ./tests/e2e
        command: ['node', '--test', 'observability.test.mjs']
        environment:
            PROMETHEUS_URL: http://prometheus:9090
            TEMPO_URL: http://tempo:3200
            GRAFANA_URL: http://grafana:3000
            GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
            GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-password}
            AUTH_URL: http://bnpb-auth:3000
            CLIENT_API_URL: http://bnpb-client-api:3000
        volumes:
            - ./test-results/observability:/results

configs:
    prometheus:
        content: |
            global:
              scrape_interval: 5s
              evaluation_interval: 5s
            scrape_configs:
              - job_name: bnpb-aggregator
                dns_sd_configs:
                  - names: [bnpb-aggregator]
                    type: A
                    port: ${BNPB_AGGREGATOR_CONTAINER_PORT:-3000}
                    refresh_interval: 5s
              - job_name: applications
                static_configs:
                  - targets: ['bmkg:8081', 'pvmbg:8082', 'bnpb-auth:3000', 'bnpb-client-api:3000', 'dashboard-consumer:${DASHBOARD_CONSUMER_CONTAINER_PORT:-3000}', 'notification-consumer:${NOTIFICATION_CONSUMER_CONTAINER_PORT:-3000}']
              - job_name: prometheus
                static_configs:
                  - targets: ['localhost:9090']

volumes:
    prometheus_data:
    tempo_data:
    grafana_data:
