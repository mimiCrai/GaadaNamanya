apiVersion: v1
kind: Service
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: canonical-config
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: canonical-config }
  ports: [{ name: mongo, port: 27017 }]
---
apiVersion: v1
kind: Service
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: canonical-shard-a
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: canonical-shard-a }
  ports: [{ name: mongo, port: 27017 }]
---
apiVersion: v1
kind: Service
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: canonical-shard-b
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: canonical-shard-b }
  ports: [{ name: mongo, port: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: canonical-config
spec:
  serviceName: canonical-config
  replicas: 3
  selector:
    matchLabels: { app: canonical-config }
  template:
    metadata:
      labels: { app: canonical-config, role: store }
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: canonical-config }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: mongo
          image: mongo:7.0.32
          command: [ /bin/sh, /opt/mongodb/start.sh, mongod, --configsvr, --replSet, canonical-config, --port, '27017', --dbpath, /data/db, --bind_ip_all ]
          envFrom:
            - secretRef: { name: canonical-mongo }
          ports: [{ containerPort: 27017, name: mongo }]
          readinessProbe:
            exec: { command: [ mongosh, --quiet, --eval, 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' ] }
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data/db }
            - { name: scripts, mountPath: /opt/mongodb, readOnly: true }
      volumes:
        - name: scripts
          configMap: { name: canonical-mongo-scripts, defaultMode: 365 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ ReadWriteOnce ]
        resources:
          requests: { storage: 10Gi }
---
