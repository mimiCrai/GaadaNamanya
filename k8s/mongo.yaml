apiVersion: v1
kind: Service
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: canonical-store
spec:
  selector: { app: canonical-store }
  ports: [{ name: mongo, port: 27017, targetPort: 27017 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: canonical-config
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: canonical-config }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: canonical-shard-a
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: canonical-shard-a }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: canonical-shard-b
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: canonical-shard-b }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: sistem-informasi-kebencanaan-bnpb
  name: canonical-store
spec:
  replicas: 2
  selector:
    matchLabels: { app: canonical-store }
  template:
    metadata:
      labels: { app: canonical-store, role: other }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: canonical-store }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: mongos
          image: mongo:7.0.32
          command: [ /bin/sh, /opt/mongodb/start.sh, mongos, --configdb, 'canonical-config/canonical-config-0.canonical-config:27017,canonical-config-1.canonical-config:27017,canonical-config-2.canonical-config:27017', --port, '27017', --bind_ip_all ]
          envFrom:
            - secretRef: { name: canonical-mongo }
          ports: [{ containerPort: 27017, name: mongo }]
          readinessProbe:
            exec: { command: [ mongosh, --quiet, --eval, 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)' ] }
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: scripts, mountPath: /opt/mongodb, readOnly: true }
      volumes:
        - name: scripts
          configMap: { name: canonical-mongo-scripts, defaultMode: 365 }
